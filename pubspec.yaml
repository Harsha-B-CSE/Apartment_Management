name: apartment_app
description: Apartment Management System (AMS) - SaaS Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: 4.10.0
  firebase_auth: 6.5.2
  firebase_storage: 13.4.2
  firebase_messaging: 16.3.0
  firebase_app_check: 0.4.4+2
  cloud_firestore: 6.5.0
  
  # Navigation
  go_router: 17.2.2
  flutter_local_notifications: 21.0.0
  
  # State management
  provider: 6.1.2

  # UI & Animations
  font_awesome_flutter: 11.0.0
  cached_network_image: 3.3.1
  image_picker: 1.1.2
  intl: 0.20.2
  shimmer: 3.0.0
  flutter_animate: 4.5.0
  google_fonts: 8.1.0
  flutter_spinkit: 5.2.1

  # Charts & QR & PDF (New)
  fl_chart: 1.2.0
  qr_flutter: 4.1.0
  pdf: ^3.11.1
  printing: ^5.11.1
  
  # Utils
  shared_preferences: 2.3.2
  uuid: 4.4.2
  connectivity_plus: 7.1.1
  hive_flutter: 1.1.0
  hive: 2.2.3
  local_auth: 3.0.1
  flutter_secure_storage: 10.3.1
  package_info_plus: 10.1.0
  crypto: 3.0.5
  device_info_plus: 13.1.0
  path_provider: 2.1.5
  open_filex: ^4.7.0
  share_plus: 13.1.0
  haptic_feedback: 0.6.4+3
  mobile_scanner: 7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  hive_generator: 2.0.1
  build_runner: 2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/config/
